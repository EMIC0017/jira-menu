name: Release

# Tag-triggered release. Push a tag like v0.1.1 and this workflow:
#   1. Builds JiraMenu.app (universal, ad-hoc signed in CI since we don't
#      ship the self-signed dev cert to GitHub).
#   2. Zips it and computes sha256.
#   3. Creates a GitHub Release with the zip attached.
#   4. (Optional) Bumps the Homebrew tap cask if TAP_REPO_TOKEN is set.
#
# Security note: every ${{ }} expression is funneled through env: and
# referenced as "$VAR" in shell. This follows GitHub's own injection
# hardening guidance — the shell treats env values as literal strings
# rather than re-parsing them as code.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macos-15 ships with Xcode 16 (Swift 6.0+); macos-14 only has Swift
    # 5.10 which rejects this project's swift-tools-version:6.0 manifest.
    runs-on: macos-15
    # Hoist TAP_REPO_TOKEN to job-level env so step-level `if:` can read
    # it via the env context. GitHub Actions disallows the `secrets`
    # context inside step-level `if:` expressions (for audit-trail
    # reasons — keeps secret names out of pre-evaluation logs), but
    # `env` is fair game.
    env:
      # Secret is stored in the repo under the name `jiramenu_bump` — we
      # alias it to TAP_REPO_TOKEN here so the rest of the job keeps
      # reading a semantically named env var.
      TAP_REPO_TOKEN: ${{ secrets.jiramenu_bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # REF_NAME looks like v0.1.1; strip the leading v for the plain version.
          TAG="$REF_NAME"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build JiraMenu.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh "$VERSION"

      - name: Create DMG
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # UDZO = zlib-compressed read-only DMG. Same approximate size as
          # a `ditto`-style zip, but double-clickable for users who want to
          # install by drag-and-drop instead of via Homebrew. The app
          # bundle is the only thing on the DMG — no custom background or
          # Applications alias yet (can be layered on later via
          # `hdiutil create -srcfolder <staging-dir>`).
          cd build
          DMG_NAME="JiraMenu-$TAG.dmg"
          hdiutil create -volname "JiraMenu" \
                         -srcfolder JiraMenu.app \
                         -ov -format UDZO \
                         "$DMG_NAME"
          echo "DMG_PATH=build/$DMG_NAME" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME"       >> "$GITHUB_ENV"

      - name: Compute sha256
        run: |
          SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "sha256: $SHA256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          body: |
            Automated release build.

            SHA256: `${{ env.SHA256 }}`

            Install via Homebrew:
            ```
            brew tap EMIC0017/jira-menu
            brew install --cask jira-menu
            ```
            The cask strips the macOS quarantine attribute in `postflight`,
            so the first launch doesn't trigger the "Apple cannot check
            this app for malware" dialog.

      - name: Bump Homebrew tap cask
        if: env.TAP_REPO_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Clone the tap repo using the PAT, rewrite version + sha256 lines
          # in the cask, and push back. If TAP_REPO_TOKEN isn't configured,
          # this step is skipped (see `if:` above) and the release still
          # succeeds — the user can bump the cask manually.
          set -euo pipefail
          git config --global user.email "205083344+EMIC0017@users.noreply.github.com"
          git config --global user.name  "EMIC0017"

          TAP_DIR="$RUNNER_TEMP/homebrew-jira-menu"
          git clone "https://x-access-token:$TAP_REPO_TOKEN@github.com/EMIC0017/homebrew-jira-menu.git" "$TAP_DIR"

          CASK="$TAP_DIR/Casks/jira-menu.rb"
          # BSD sed (macOS) needs the empty string after -i.
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" "$CASK"
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/"    "$CASK"
          # Ensure the cask url ends in .dmg (migration from zip → dmg).
          # No-op once the cask already says .dmg, so it's safe to keep
          # running on every release. Anchored to the `url` line only so
          # it can't accidentally rewrite a .zip mention elsewhere in the
          # file (there aren't any today, but be strict anyway).
          sed -i '' -E '/^  url /s/\.zip"/.dmg"/' "$CASK"

          cd "$TAP_DIR"
          if git diff --quiet; then
            echo "No cask changes to commit."
            exit 0
          fi
          git add Casks/jira-menu.rb
          git commit -m "jira-menu $VERSION"
          git push origin HEAD
